name: Backend CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-cicd.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/backend-cicd.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: myobject-rn-docker

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      MYSQL_USER: evidence
      MYSQL_PASSWORD: evidence_test
      MYSQL_DATABASE: evidence_test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: evidence_test
          MYSQL_USER: evidence
          MYSQL_PASSWORD: evidence_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptest_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Smoke test API (with MySQL)
        working-directory: backend
        env:
          PORT: 3099
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          PUBLIC_BASE_URL: http://localhost:3099
        run: |
          set -euo pipefail
          node dist/index.js &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          echo "Waiting for /health..."
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3099/health" >/dev/null; then
              echo "health OK"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "health never became ready"
              exit 1
            fi
            sleep 2
          done

          EMAIL="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          echo "Register test user: $EMAIL"
          curl -fsS -X POST http://127.0.0.1:3099/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"secret1\"}"

  build-and-push:
    needs: test
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        run: |
          test -n "${{ secrets.DOCKERHUB_USERNAME }}" || (echo "Missing DOCKERHUB_USERNAME secret"; exit 1)
          test -n "${{ secrets.DOCKERHUB_TOKEN }}" || (echo "Missing DOCKERHUB_TOKEN secret"; exit 1)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    needs: build-and-push
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate server secrets
        run: |
          test -n "${{ secrets.SERVER_HOST }}" || (echo "Missing SERVER_HOST secret"; exit 1)
          test -n "${{ secrets.SERVER_USER }}" || (echo "Missing SERVER_USER secret"; exit 1)
          test -n "${{ secrets.SERVER_SSH_KEY }}" || (echo "Missing SERVER_SSH_KEY secret"; exit 1)
          test -n "${{ secrets.SERVER_APP_DIR }}" || (echo "Missing SERVER_APP_DIR secret"; exit 1)

      - name: Sync backend to server (fallback build source)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "backend"
          target: "${{ secrets.SERVER_APP_DIR }}/"
          overwrite: true

      - name: Deploy to Aliyun via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_IMAGE_OVERRIDE: ${{ secrets.DOCKERHUB_USERNAME }}/myobject-rn-docker:latest
          DEPLOY_SKIP_GIT_PULL: "1"
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 30m
          debug: true
          envs: APP_DIR,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,DOCKER_IMAGE_OVERRIDE,DEPLOY_SKIP_GIT_PULL
          script_path: deploy/scripts/deploy-remote.sh
