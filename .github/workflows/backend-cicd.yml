name: Backend CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-cicd.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  IMAGE_NAME: myobject-rn-docker

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret
      MYSQL_USER: evidence
      MYSQL_PASSWORD: evidence_test
      MYSQL_DATABASE: evidence_test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: evidence_test
          MYSQL_USER: evidence
          MYSQL_PASSWORD: evidence_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptest_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Smoke test API (with MySQL)
        working-directory: backend
        env:
          PORT: 3099
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          PUBLIC_BASE_URL: http://localhost:3099
        run: |
          node dist/index.js &
          PID=$!
          sleep 8
          curl -fsS http://127.0.0.1:3099/health
          curl -fsS -X POST http://127.0.0.1:3099/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"secret1"}'
          kill $PID || true

  build-and-push:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Aliyun via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_IMAGE_OVERRIDE: ${{ secrets.DOCKERHUB_USERNAME }}/myobject-rn-docker:latest
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 30m
          debug: true
          envs: APP_DIR,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,DOCKER_IMAGE_OVERRIDE
          # Runs the checked-out script from the runner (no need for server git to have it first)
          script_path: deploy/scripts/deploy-remote.sh
