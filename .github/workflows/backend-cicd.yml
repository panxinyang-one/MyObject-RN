name: Backend CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-cicd.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  IMAGE_NAME: myobject-rn-docker

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: evidence_test
          MYSQL_USER: evidence
          MYSQL_PASSWORD: evidence_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptest_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Smoke test API (with MySQL)
        working-directory: backend
        env:
          PORT: 3099
          JWT_SECRET: ci-test-secret
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: evidence
          MYSQL_PASSWORD: evidence_test
          MYSQL_DATABASE: evidence_test
          PUBLIC_BASE_URL: http://localhost:3099
        run: |
          node dist/index.js &
          PID=$!
          sleep 8
          curl -fsS http://127.0.0.1:3099/health
          curl -fsS -X POST http://127.0.0.1:3099/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"secret1"}'
          kill $PID || true

  build-and-push:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Aliyun via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          debug: true
          script: |
            set -euxo pipefail
            APP_DIR="${{ secrets.SERVER_APP_DIR }}"
            cd "$APP_DIR"
            echo "=== server diag ==="
            whoami
            pwd
            ls -la
            echo "=== check env file ==="
            test -f deploy/.env.prod || (echo "Missing deploy/.env.prod (copy deploy/env.prod.example -> deploy/.env.prod and fill secrets)"; exit 1)
            export DOCKER_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/myobject-rn-docker:latest"
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod pull api
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d
            sleep 5
            curl -fsS "http://127.0.0.1:3000/health"
